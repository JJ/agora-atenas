<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agora of Athens</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f4ede1;
    --paper: #fffaf1;
    --ink: #2b2118;
    --muted: #7a6a58;
    --line: #e2d5bf;
    --accent: #e3a019;
    --accent-ink: #8a5a00;
    --good: #3f8a5a;
    --ok: #8fae3c;
    --meh: #d98c2b;
    --bad: #c4553b;
    --shadow: 0 1px 2px rgba(60, 40, 10, .08), 0 8px 24px rgba(60, 40, 10, .08);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font: 16px/1.4 "Source Sans 3", system-ui, sans-serif;
  }
  header {
    text-align: center;
    padding: 20px 16px 8px;
  }
  h1 {
    font-family: Cinzel, Georgia, serif;
    font-weight: 700;
    letter-spacing: .06em;
    margin: 0;
    font-size: clamp(1.5rem, 4vw, 2.3rem);
  }
  header p { margin: 4px 0 0; color: var(--muted); }

  main {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 360px;
    gap: 20px;
    max-width: 1240px;
    margin: 0 auto;
    padding: 12px 16px 24px;
    align-items: start;
  }
  @media (max-width: 900px) {
    main { grid-template-columns: minmax(0, 1fr); }
  }

  .card {
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 14px;
    box-shadow: var(--shadow);
  }

  /* Map */
  .map { padding: 10px; }
  .stage { position: relative; }
  .stage img { display: block; width: 100%; height: auto; border-radius: 8px; }
  .stage svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .credit { font-size: .75rem; color: var(--muted); text-align: right; margin: 6px 4px 0; }
  .credit a { color: inherit; }

  .current path, .current circle { fill: var(--accent); animation: pulse 1.3s ease-in-out infinite; }
  .current { filter: drop-shadow(0 0 5px rgba(227, 160, 25, .9)); }
  .current circle.ring { fill: none; stroke: var(--accent); stroke-width: 4; }
  .solved path { fill: var(--good); opacity: .65; }
  .missed path { fill: var(--bad); opacity: .6; }
  .hill.solved path, .hill.missed path { opacity: .3; }
  .hill.current path { animation-name: pulse-soft; }
  @keyframes pulse { 50% { opacity: .45; } }
  @keyframes pulse-soft { 0%, 100% { opacity: .55; } 50% { opacity: .2; } }

  .label rect { fill: #fff; stroke-width: 1.5; }
  .label text { font: 600 10.5px "Source Sans 3", sans-serif; fill: var(--ink); text-anchor: middle; }
  .label.ok rect { stroke: var(--good); }
  .label.ko rect { stroke: var(--bad); }
  .label { animation: pop .35s cubic-bezier(.3, 1.6, .5, 1) both; transform-box: fill-box; transform-origin: center; }
  @keyframes pop { from { transform: scale(.3); opacity: 0; } }

  /* Side panel */
  aside { display: flex; flex-direction: column; gap: 16px; }
  @media (min-width: 901px) { aside { position: sticky; top: 12px; } }

  .score { display: flex; align-items: center; gap: 16px; padding: 16px; }
  .gauge { position: relative; width: 104px; height: 104px; flex: none; }
  .gauge svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .gauge .track { fill: none; stroke: var(--line); stroke-width: 9; }
  .gauge .fill { fill: none; stroke: url(#gold); stroke-width: 9; stroke-linecap: round; transition: stroke-dashoffset .6s ease; }
  .gauge .num {
    position: absolute; inset: 0; display: grid; place-content: center; text-align: center;
  }
  .gauge .num b { font: 700 2rem/1 Cinzel, Georgia, serif; }
  .gauge .num small { color: var(--muted); font-size: .8rem; }
  .gauge.bump .num b { animation: bump .45s ease; }
  @keyframes bump { 40% { transform: scale(1.3); color: var(--good); } }

  .score-info { flex: 1; min-width: 0; }
  .score-info .lbl { text-transform: uppercase; letter-spacing: .1em; font-size: .75rem; color: var(--muted); }
  .score-info .prog { font-weight: 600; margin: 2px 0 8px; }
  .segments { display: grid; grid-template-columns: repeat(20, 1fr); gap: 3px; }
  .segments i { height: 8px; border-radius: 2px; background: var(--line); transition: background .3s; }
  .segments i.now { background: var(--accent); }
  .segments i.p3 { background: var(--good); }
  .segments i.p2 { background: var(--ok); }
  .segments i.p1 { background: var(--meh); }
  .segments i.p0 { background: var(--bad); }

  .ask { padding: 16px; }
  .ask h2 { font: 600 1.1rem/1.3 "Source Sans 3", sans-serif; margin: 0 0 10px; }
  .tries { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: .85rem; margin-bottom: 10px; }
  .tries i { width: 12px; height: 12px; border-radius: 50%; background: var(--accent); transition: background .3s, transform .3s; }
  .tries i.used { background: var(--line); transform: scale(.75); }
  .feedback { min-height: 1.5em; font-weight: 600; margin-bottom: 10px; }
  .feedback.good { color: var(--good); }
  .feedback.bad { color: var(--bad); }

  .bank { display: flex; flex-wrap: wrap; gap: 6px; }
  .bank button {
    font: inherit; font-size: .9rem;
    border: 1px solid var(--line); background: #fff; color: var(--ink);
    border-radius: 999px; padding: 5px 12px; cursor: pointer;
    transition: background .15s, border-color .15s, transform .1s;
  }
  .bank button:hover:not(:disabled) { border-color: var(--accent); background: #fff6e0; }
  .bank button:active:not(:disabled) { transform: scale(.96); }
  .bank button:disabled { cursor: default; }
  .bank button.done { opacity: .35; text-decoration: line-through; }
  .bank button.wrong { background: #fbe4de; border-color: var(--bad); color: var(--bad); animation: shake .35s; }
  .bank button.right { background: var(--good); border-color: var(--good); color: #fff; }
  @keyframes shake { 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }

  /* End screen */
  .overlay {
    position: fixed; inset: 0; background: rgba(43, 33, 24, .55);
    display: grid; place-items: center; padding: 16px;
  }
  .overlay[hidden] { display: none; }
  .final { padding: 28px 24px; text-align: center; max-width: 380px; width: 100%; }
  .final h2 { font-family: Cinzel, Georgia, serif; margin: 0 0 8px; }
  .final .big { font: 700 3.2rem/1 Cinzel, Georgia, serif; color: var(--accent-ink); margin: 12px 0; }
  .final p { margin: 4px 0; color: var(--muted); }
  .final button {
    margin-top: 18px; font: 600 1rem "Source Sans 3", sans-serif;
    background: var(--accent); color: #fff; border: 0; border-radius: 999px;
    padding: 10px 26px; cursor: pointer;
  }
  .error { max-width: 640px; margin: 40px auto; padding: 20px; color: var(--bad); }
</style>
</head>
<body>
<header>
  <h1 data-ui="title">The Agora of Athens</h1>
  <p data-ui="subtitle"></p>
</header>

<main id="game" hidden>
  <section class="card map">
    <div class="stage">
    <img src="agora.png" alt="" width="808" height="720">
    <svg id="overlay" viewBox="0 0 808 720" aria-hidden="true">
      <g id="hill"></g>
      <g id="punch" fill="#c0c0c0"></g>
      <g id="fills"></g>
      <g id="labels"></g>
    </svg>
    </div>
    <p class="credit"><a href="https://www.worldhistory.org/image/192/agora-of-athens/" data-ui="credit"></a></p>
  </section>

  <aside>
    <div class="card score">
      <div class="gauge" id="gauge">
        <svg viewBox="0 0 100 100">
          <defs>
            <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#f2c14e"/><stop offset="1" stop-color="#c47f0a"/>
            </linearGradient>
          </defs>
          <circle class="track" cx="50" cy="50" r="42"/>
          <circle class="fill" id="gaugeFill" cx="50" cy="50" r="42"/>
        </svg>
        <div class="num"><b id="score">0</b><small id="max">/ 60</small></div>
      </div>
      <div class="score-info">
        <div class="lbl" data-ui="score"></div>
        <div class="prog" id="progress"></div>
        <div class="segments" id="segments"></div>
      </div>
    </div>

    <div class="card ask">
      <h2 data-ui="question"></h2>
      <div class="tries"><span data-ui="tries"></span><i></i><i></i><i></i></div>
      <div class="feedback" id="feedback" aria-live="polite"></div>
      <div class="bank" id="bank"></div>
    </div>
  </aside>
</main>

<div class="overlay" id="end" hidden>
  <div class="card final">
    <h2 data-ui="finished"></h2>
    <div class="big" id="finalScore"></div>
    <p id="finalText"></p>
    <p id="firstTry"></p>
    <button id="again" data-ui="playAgain"></button>
  </div>
</div>

<script>
const TRIES = 3;
const SVG_NS = "http://www.w3.org/2000/svg";
const REGIONS = JSON.parse(document.getElementById("regions").textContent);
// Agora stone (9) is a point, not a grey area: mark it with a ring.
const POINTS = { 9: [333, 454] };
// Nudge labels that would overlap their neighbours.
const LABEL_SHIFT = { 11: [8, 0], 12: [-10, 0] };

const $ = id => document.getElementById(id);
const fmt = (s, vars) => s.replace(/\{(\w+)\}/g, (_, k) => vars[k]);
let T, NAMES, IDS, state;

function el(tag, attrs, parent) {
  const e = document.createElementNS(SVG_NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(e);
  return e;
}

function shuffle(a) {
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function drawShape(id, cls) {
  const g = el("g", { class: cls, "data-id": id }, id === "7" ? $("hill") : $("fills"));
  if (POINTS[id]) {
    const [x, y] = POINTS[id];
    el("circle", { class: "ring", cx: x, cy: y, r: 15 }, g);
  } else {
    el("path", { d: REGIONS.paths[id] }, g);
  }
  if (id === "7") g.classList.add("hill");
  return g;
}

// Put the name over the legend number, wrapped into short lines.
function drawLabel(id, ok) {
  const [x0, y0, x1, y1] = REGIONS.labels[id];
  const [dx, dy] = LABEL_SHIFT[id] || [0, 0];
  const cx = (x0 + x1) / 2 + dx, cy = (y0 + y1) / 2 + dy;
  const lines = [];
  for (const w of NAMES[id].split(" ")) {
    const last = lines[lines.length - 1];
    if (last && (last + " " + w).length <= 13) lines[lines.length - 1] += " " + w;
    else lines.push(w);
  }
  const g = el("g", { class: "label " + (ok ? "ok" : "ko") }, $("labels"));
  const rect = el("rect", { rx: 4 }, g);
  const lh = 12, top = cy - (lines.length * lh) / 2 + 9;
  const text = el("text", {}, g);
  lines.forEach((l, i) => {
    const t = el("tspan", { x: cx, y: top + i * lh }, text);
    t.textContent = l;
  });
  const b = text.getBBox();
  rect.setAttribute("x", b.x - 4);
  rect.setAttribute("y", b.y - 2);
  rect.setAttribute("width", b.width + 8);
  rect.setAttribute("height", b.height + 4);
}

function renderScore(bump) {
  const max = IDS.length * TRIES;
  $("score").textContent = state.score;
  $("max").textContent = "/ " + max;
  const c = 2 * Math.PI * 42;
  const fill = $("gaugeFill");
  fill.style.strokeDasharray = c;
  fill.style.strokeDashoffset = c * (1 - state.score / max);
  if (bump) {
    $("gauge").classList.remove("bump");
    void $("gauge").offsetWidth;
    $("gauge").classList.add("bump");
  }
  const segs = $("segments");
  segs.style.gridTemplateColumns = `repeat(${IDS.length}, 1fr)`;
  segs.innerHTML = "";
  state.order.forEach((id, i) => {
    const s = document.createElement("i");
    if (i < state.results.length) s.className = "p" + state.results[i];
    else if (i === state.index) s.className = "now";
    segs.appendChild(s);
  });
  const n = Math.min(state.index + 1, IDS.length);
  $("progress").textContent = fmt(T.progress, { n, total: IDS.length });
}

function renderTries() {
  document.querySelectorAll(".tries i").forEach((d, i) =>
    d.classList.toggle("used", i < state.wrong));
}

function renderBank() {
  const bank = $("bank");
  bank.innerHTML = "";
  const sorted = [...IDS].sort((a, b) => NAMES[a].localeCompare(NAMES[b], T.lang));
  for (const id of sorted) {
    const b = document.createElement("button");
    b.textContent = NAMES[id];
    b.dataset.id = id;
    if (state.done.has(id)) { b.disabled = true; b.classList.add("done"); }
    b.onclick = () => answer(b);
    bank.appendChild(b);
  }
}

function ask() {
  if (state.index >= state.order.length) return finish();
  state.wrong = 0;
  state.locked = false;
  state.current = drawShape(state.order[state.index], "current");
  $("feedback").textContent = "";
  $("feedback").className = "feedback";
  renderTries();
  renderBank();
  renderScore(false);
}

function settle(points) {
  const id = state.order[state.index];
  const ok = points > 0;
  state.locked = true;
  state.score += points;
  state.results.push(points);
  state.done.add(id);
  state.current.setAttribute("class", (ok ? "solved" : "missed") + (id === "7" ? " hill" : ""));
  drawLabel(id, ok);
  state.index++;
  renderScore(ok);
  setTimeout(ask, ok ? 1100 : 2200);
}

function answer(btn) {
  if (state.locked || btn.disabled) return;
  const id = state.order[state.index];
  const fb = $("feedback");
  if (btn.dataset.id === id) {
    const points = TRIES - state.wrong;
    btn.classList.add("right");
    fb.textContent = fmt(T.correct, { points });
    fb.className = "feedback good";
    settle(points);
    return;
  }
  state.wrong++;
  btn.disabled = true;
  btn.classList.add("wrong");
  renderTries();
  const left = TRIES - state.wrong;
  fb.className = "feedback bad";
  if (left > 0) {
    fb.textContent = left === 1 ? T.wrongLast : fmt(T.wrong, { left });
  } else {
    fb.textContent = fmt(T.missed, { name: NAMES[id] });
    settle(0);
  }
}

function finish() {
  const max = IDS.length * TRIES;
  $("finalScore").textContent = `${state.score} / ${max}`;
  $("finalText").textContent = fmt(T.finalScore, { score: state.score, max });
  $("firstTry").textContent = fmt(T.firstTry, { count: state.results.filter(p => p === TRIES).length });
  $("end").hidden = false;
}

function start() {
  for (const g of ["hill", "fills", "labels"]) $(g).innerHTML = "";
  state = { order: shuffle([...IDS]), index: 0, score: 0, results: [], done: new Set(), wrong: 0 };
  $("end").hidden = true;
  ask();
}

fetch("buildings.json")
  .then(r => r.json())
  .then(data => {
    T = { ...data.ui, lang: data.lang };
    NAMES = data.names;
    IDS = Object.keys(NAMES);
    document.documentElement.lang = data.lang;
    document.title = T.title;
    document.querySelectorAll("[data-ui]").forEach(e => { e.textContent = T[e.dataset.ui]; });
    // Grey copies of every building, so the hill highlight never tints them.
    for (const id in REGIONS.paths) if (id !== "7") el("path", { d: REGIONS.paths[id] }, $("punch"));
    $("again").onclick = start;
    $("game").hidden = false;
    start();
  })
  .catch(() => {
    const p = document.createElement("p");
    p.className = "card error";
    p.textContent = "Could not load buildings.json. Serve this folder over HTTP (e.g. python3 -m http.server) instead of opening the file directly.";
    document.body.appendChild(p);
  });
</script>
